# GitHub Actions 工作流：编译 X-WRT 固件 for NanoPi R4S DDR3 1GB
# 原理：编译 X-WRT 标准固件后，用 immortalwrt 的 U-Boot 引导区替换
# immortalwrt 使用 rk3399_ddr_800MHz_v1.30.bin DDR 初始化二进制，同时支持 DDR3 和 LPDDR4
#
# 核心原理：
# - X-WRT 使用 pine64-img 引导流程：单个 u-boot-rockchip.bin 写入 sector 64（TPL 仅 LPDDR4）
# - immortalwrt 使用 pine64-bin 引导流程：idbloader(sector 64) + uboot.img(sector 16384) + trust.bin(sector 24576)
# - 两个镜像的 MBR 分区表都从 sector 65536 (32MB) 开始，sector 64-32767 是引导保留区
# - 用 immortalwrt 的引导区替换 X-WRT 的引导区，即可支持 DDR3 1GB 版

name: Build X-WRT R4S DDR3

on:
  workflow_dispatch:
    inputs:
      xwrt_tag:
        description: 'X-WRT 分支/标签 (master=26.04 开发版, 或稳定分支如 v26.04_b202604250947)'
        required: true
        default: 'v26.04_b202604250947'
      immwrt_tag:
        description: 'immortalwrt 版本 (snapshot=每日最新, 或稳定版如 25.12.1)'
        required: true
        default: '25.12.1'

env:
  XWRT_TAG: ${{ github.event.inputs.xwrt_tag || 'v26.04_b202604250947' }}
  IMMWRT_TAG: ${{ github.event.inputs.immwrt_tag || '25.12.1' }}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # ============================================================
    # 环境准备：安装依赖 + 清理磁盘空间
    # ============================================================
    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 清理磁盘空间（混合策略）
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/.ghcup /usr/local/share/powershell \
          /usr/local/lib/node_modules /opt/hostedtoolcache

        sudo -E apt-get update
        sudo -E apt-get -y purge \
          dotnet* azure* google* firefox* moby* mysql* \
          firebird* gh* llvm-* postgresql* powershell* openjdk-* \
          mpi-default-dev 2>/dev/null || true
        sudo -E apt-get -y autoremove --purge || true
        sudo -E apt-get clean

        sudo -E apt-get update
        sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk \
          gettext git libncurses5-dev libz-dev patch unzip zlib1g-dev \
          libc6-dev-i386 subversion flex uglifyjs git-core \
          gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo \
          libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf \
          automake libtool autopoint device-tree-compiler \
          python3 python3-pip python3-dev python3-setuptools python3-pyelftools swig
        sudo -E apt-get -y autoremove --purge || true
        sudo -E apt-get clean

        echo "=== 磁盘空间 ==="
        df -h .
        echo "================"

    # ============================================================
    # 第一步：下载 immortalwrt 预编译固件（提取 DDR3 兼容的 U-Boot）
    # ============================================================
    - name: 下载 immortalwrt R4S 预编译固件
      run: |
        mkdir -p immwrt
        cd immwrt

        IMMWRT_BASE="https://downloads.immortalwrt.org"

        if [ "$IMMWRT_TAG" = "snapshot" ]; then
          IMMWRT_URL="$IMMWRT_BASE/snapshots/targets/rockchip/armv8"
        else
          IMMWRT_URL="$IMMWRT_BASE/releases/${IMMWRT_TAG}/targets/rockchip/armv8"
        fi

        echo "从 $IMMWRT_URL 下载..."

        wget -q "$IMMWRT_URL/" -O index.html || {
          echo "无法访问 $IMMWRT_URL/"
          exit 1
        }

        # 查找 R4S squashfs sysupgrade 固件（非 enterprise 版）
        IMG_FILE=$(grep -oP 'immortalwrt-[^"]*friendlyarm_nanopi-r4s-squashfs-sysupgrade\.img\.gz' index.html | head -1)

        if [ -z "$IMG_FILE" ]; then
          echo "未找到 R4S 固件，尝试 enterprise 版..."
          IMG_FILE=$(grep -oP 'immortalwrt-[^"]*friendlyarm_nanopi-r4s-enterprise-squashfs-sysupgrade\.img\.gz' index.html | head -1)
        fi

        if [ -z "$IMG_FILE" ]; then
          echo "未找到 R4S 固件，列出可用文件："
          grep -oP 'immortalwrt-[^"]*\.img\.gz' index.html | head -20
          exit 1
        fi

        echo "下载固件: $IMG_FILE"
        wget -q "$IMMWRT_URL/$IMG_FILE" -O immwrt-r4s.img.gz
        # OpenWrt 的 sysupgrade .img.gz 在 gzip 流后会附加 JSON 元数据，
        # gzip 解压成功但退出码为 2（warning），需要容忍该退出码
        gzip -dc immwrt-r4s.img.gz > immwrt-r4s.img || rc=$?
        if [ "${rc:-0}" -ne 0 ] && [ "${rc:-0}" -ne 2 ]; then
            echo "错误: immwrt-r4s.img.gz 解压失败 (gzip 退出码 ${rc:-0})"
            exit 1
        fi
        rm -f immwrt-r4s.img.gz

        ls -lh immwrt-r4s.img

        # 校验 immortalwrt 引导区布局（pine64-bin: idbloader/uboot.img/trust.bin）
        echo "=== immortalwrt 引导区布局校验 ==="
        dd if=immwrt-r4s.img bs=512 skip=16384 count=1 2>/dev/null | head -c 8 | grep -q 'LOADER  ' || {
          echo "错误: sector 16384 不是 uboot.img（布局可能已变化）"; exit 1; }
        dd if=immwrt-r4s.img bs=512 skip=24576 count=1 2>/dev/null | head -c 4 | grep -q 'BL3X' || {
          echo "错误: sector 24576 不是 trust.bin（布局可能已变化）"; exit 1; }
        echo "布局校验通过"
        echo "================================"

    # ============================================================
    # 第二步：克隆并编译 X-WRT 固件
    # ============================================================
    - name: 克隆 X-WRT 源码
      run: |
        git clone --depth 1 --branch "$XWRT_TAG" https://github.com/x-wrt/x-wrt.git
        echo "X-WRT 版本: $(cd x-wrt && git log --oneline -1)"

    - name: 更新 feeds
      run: cd x-wrt && ./scripts/feeds update -a

    - name: 安装 feeds
      run: cd x-wrt && ./scripts/feeds install -a

    - name: 编译 X-WRT (rockchip-armv8)
      run: |
        cd x-wrt

        cp ../build.sh .
        cp ../upload.sh .

        if [ "$XWRT_TAG" = "master" ]; then
          echo "26.04_b$(date -u '+%Y%m%d%H%M%S')" > release.tag
        else
          echo "$XWRT_TAG" > release.tag
        fi
        echo "版本标签: $(cat release.tag)"

        if [ -f feeds/x/rom/lede/cfg.list ]; then
          echo "=== cfg.list 中的 rockchip 配置 ==="
          grep rockchip feeds/x/rom/lede/cfg.list || echo "未找到 rockchip 配置"
        else
          echo "警告: cfg.list 不存在"
        fi

        if [ -f feeds/x/rom/lede/config.rockchip-armv8 ]; then
          echo "config.rockchip-armv8 存在"
        else
          echo "警告: config.rockchip-armv8 不存在"
        fi

        # 只保留 NanoPi R4S 设备，大幅缩短编译时间和磁盘占用
        sed -i -E 's/^(CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*)=y/# \1 is not set/' feeds/x/rom/lede/config.rockchip-armv8
        echo 'CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s=y' >> feeds/x/rom/lede/config.rockchip-armv8
        grep -q 'CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s=y' feeds/x/rom/lede/config.rockchip-armv8 || {
          echo "错误: R4S 设备配置未生效"; exit 1; }

        echo "=== 编译前磁盘空间 ==="
        df -h .
        echo "======================"

        echo "开始编译 (TARGET=rockchip-armv8, $(nproc) threads)..."
        TARGET=rockchip-armv8 sh build.sh $(nproc)

        echo "=== 编译产物 ==="
        find bin/targets/rockchip/ -name "*.img*" 2>/dev/null | while read f; do
          ls -lh "$f"
        done
        echo "================"

    # ============================================================
    # 第三步：替换 U-Boot 引导区
    # ============================================================
    - name: 替换 U-Boot 引导区域
      run: |
        cd x-wrt
        rm -f ../firmware_paths.txt

        # 查找 X-WRT R4S 固件（squashfs 和 ext4 两种，排除 enterprise 版）
        find_r4s() {
          find bin/targets/rockchip/armv8/ \
            -name "*nanopi-r4s*$1*sysupgrade*.img*" \
            ! -name "*enterprise*" 2>/dev/null | head -1
        }

        SQ_IMG=$(find_r4s squashfs)
        EXT4_IMG=$(find_r4s ext4)

        if [ -z "$SQ_IMG" ] && [ -z "$EXT4_IMG" ]; then
          echo "未找到 R4S 固件文件"
          ls -la bin/targets/rockchip/armv8/ 2>/dev/null || true
          exit 1
        fi

        IMMWRT_IMG="../immwrt/immwrt-r4s.img"

        for IMG in "$SQ_IMG" "$EXT4_IMG"; do
          [ -n "$IMG" ] || continue

          # 如果是 .gz 压缩文件，先解压
          if [[ "$IMG" == *.gz ]]; then
            gzip -dc "$IMG" > "${IMG%.gz}" || rc=$?
            if [ "${rc:-0}" -ne 0 ] && [ "${rc:-0}" -ne 2 ]; then
              echo "错误: X-WRT 固件解压失败 (gzip 退出码 ${rc:-0})"
              exit 1
            fi
            rm -f "$IMG"
            IMG="${IMG%.gz}"
          fi

          OUT_IMG="${IMG%.img}-ddr3.img"
          echo "处理: $IMG -> $OUT_IMG"
          bash ../replace-uboot.sh "$IMG" "$IMMWRT_IMG" "$OUT_IMG"
          echo "$(pwd)/$OUT_IMG" >> ../firmware_paths.txt
        done

        echo "=== 输出固件列表 ==="
        cat ../firmware_paths.txt

    # ============================================================
    # 第四步：打包上传
    # ============================================================
    - name: 压缩固件
      run: |
        OUTPUT_DIR="firmware"
        mkdir -p "$OUTPUT_DIR"

        VERSION_TAG=$(cat x-wrt/release.tag)

        while IFS= read -r IMG_FULL; do
          [ -n "$IMG_FULL" ] || continue
          BASE=$(basename "$IMG_FULL")
          VARIANT=$(echo "$BASE" | grep -oE '(squashfs|ext4)' | head -1)
          [ -n "$VARIANT" ] || VARIANT="img"

          gzip -c "$IMG_FULL" > "$OUTPUT_DIR/xwrt-r4s-ddr3-${VARIANT}-${VERSION_TAG}.img.gz"
          sha256sum "$IMG_FULL" > "$OUTPUT_DIR/xwrt-r4s-ddr3-${VARIANT}-${VERSION_TAG}.sha256"
        done < firmware_paths.txt

        {
          echo 'X-WRT for NanoPi R4S DDR3 1GB'
          echo '============================='
          echo ''
          echo "Version : $VERSION_TAG"
          echo "U-Boot  : immortalwrt $IMMWRT_TAG (rk3399_ddr_800MHz_v1.30.bin)"
          echo "Built   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ''
          echo 'Files'
          echo '-----'
          echo "- squashfs: xwrt-r4s-ddr3-squashfs-${VERSION_TAG}.img.gz"
          echo "- ext4    : xwrt-r4s-ddr3-ext4-${VERSION_TAG}.img.gz"
          echo ''
          echo 'Flash'
          echo '-----'
          echo '1. Verify checksum:'
          echo "   sha256sum -c xwrt-r4s-ddr3-<variant>-${VERSION_TAG}.sha256"
          echo '2. Write the .img.gz to an SD card (balenaEtcher or dd)'
          echo '3. Boot on NanoPi R4S 1GB (DDR3)'
          echo '4. LuCI: http://192.168.15.1'
          echo ''
          echo 'Notes'
          echo '-----'
          echo '- Boot area (sector 64-32767) is replaced with immortalwrt U-Boot'
          echo '- sysupgrade keeps U-Boot, so DDR3 support survives upgrades'
          echo '- Flashing the official X-WRT image restores the LPDDR4-only U-Boot'
        } > "$OUTPUT_DIR/README.txt"

        ls -lh "$OUTPUT_DIR/"

    - name: 上传固件
      uses: actions/upload-artifact@v4
      with:
        name: xwrt-r4s-ddr3-firmware
        path: firmware/
        retention-days: 30
