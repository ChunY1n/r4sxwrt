# GitHub Actions 工作流：编译 X-WRT 固件 for NanoPi R4S DDR3 1GB
#
# 原理：编译 X-WRT 标准固件后，用 immortalwrt 的 U-Boot 引导区替换，
# 支持 DDR3 1GB 版本（rk3399_ddr_800MHz_v1.30.bin DDR 初始化，自动识别 DDR3/LPDDR4）
#
# 一次并行编译三个版本：
#   1. dae       : 官方配置 + dae/daed（luci-app-daede）+ natcap，分区 512MB 系统 / 1024MB 软件
#   2. dae-nonatcap : 同上但移除 natcap（无远程管理/一键VPN/全锥形NAT）
#   3. official  : 完全官方（无 dae、保留 natcap、官方 256MB 系统分区、官方默认配置）
#
# 三个版本都包含：
# - 内核完整 eBPF/BTF（仅 dae 两个版本；官方版保持原样）
# - 只生成 R4S 设备镜像（不影响固件内容，仅缩短编译时间）
# - immortalwrt DDR3 U-Boot 引导区

name: Build X-WRT R4S DDR3 (dae / nonatcap / official)

on:
  workflow_dispatch:
    inputs:
      xwrt_tag:
        description: 'X-WRT 标签 (latest=自动取最新 26.04, 或指定如 26.04_b202607300654)'
        required: false
        default: 'latest'
      immwrt_tag:
        description: 'immortalwrt 版本 (snapshot=每日最新, 或稳定版如 25.12.1)'
        required: true
        default: '25.12.1'
  schedule:
    - cron: '0 2 * * 0'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      xwrt_tag: ${{ steps.resolve.outputs.xwrt_tag }}
      dae_ver: ${{ steps.resolve.outputs.dae_ver }}
      skip_dae: ${{ steps.resolve.outputs.skip_dae }}
      skip_dae_nonatcap: ${{ steps.resolve.outputs.skip_dae_nonatcap }}
      skip_official: ${{ steps.resolve.outputs.skip_official }}
    steps:
      - name: 解析最新版本并检查是否已发布
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INPUT_TAG="${{ github.event.inputs.xwrt_tag }}"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN")
          resolve_api() {
            local url="$1" jqexpr="$2" out="" i
            for i in 1 2 3 4 5; do
              out=$(curl -fsS --max-time 30 "${AUTH[@]}" "$url" 2>/dev/null | jq -r "$jqexpr" 2>/dev/null)
              if [ -n "$out" ] && [ "$out" != "null" ]; then
                echo "$out"
                return 0
              fi
              sleep 5
            done
            return 1
          }
          if [ -z "$INPUT_TAG" ] || [ "$INPUT_TAG" = "latest" ]; then
            XWRT_TAG=$(resolve_api "https://api.github.com/repos/x-wrt/x-wrt/tags?per_page=100" '[.[].name] | map(select(startswith("26.04_b"))) | sort | last' || true)
          else
            XWRT_TAG="$INPUT_TAG"
          fi
          DAE_VER=$(resolve_api "https://api.github.com/repos/kenzok8/openwrt-daede/releases/latest" '.tag_name' || true)
          # 网络抖动时回退到已知可用版本，避免整个编译因解析失败而中止
          [ -n "$XWRT_TAG" ] || XWRT_TAG="26.04_b202607300654"
          [ -n "$DAE_VER" ] || DAE_VER="v2026.08.03"
          if [ -z "$XWRT_TAG" ] || [ -z "$DAE_VER" ]; then
            echo "错误: 解析最新版本失败 (xwrt=$XWRT_TAG, daede=$DAE_VER)"
            exit 1
          fi
          echo "xwrt_tag=$XWRT_TAG" >> "$GITHUB_OUTPUT"
          echo "dae_ver=$DAE_VER" >> "$GITHUB_OUTPUT"

          DEFAULT_REL="xwrt-r4s-ddr3-v${XWRT_TAG}-${DAE_VER#v}"
          NONATCAP_REL="xwrt-r4s-ddr3-nonatcap-v${XWRT_TAG}-${DAE_VER#v}"
          OFFICIAL_REL="xwrt-r4s-ddr3-official-v${XWRT_TAG}"
          check_release() {
            local key="$1" tag="$2"
            if curl -fsI "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
              echo "skip_${key}=true" >> "$GITHUB_OUTPUT"
              echo "已存在，跳过: $tag"
            else
              echo "需要编译: $tag"
            fi
          }
          check_release dae "$DEFAULT_REL"
          check_release dae_nonatcap "$NONATCAP_REL"
          check_release official "$OFFICIAL_REL"

  build:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - id: dae
            suffix: ''
            label: dae+natcap
          - id: dae-nonatcap
            suffix: '-nonatcap'
            label: dae无natcap
          - id: official
            suffix: '-official'
            label: 官方原版
    env:
      XWRT_TAG: ${{ needs.check.outputs.xwrt_tag }}
      DAE_VER: ${{ needs.check.outputs.dae_ver }}
      IMMWRT_TAG: ${{ github.event.inputs.immwrt_tag || '25.12.1' }}
      VARIANT: ${{ matrix.variant.id }}
      SUFFIX: ${{ matrix.variant.suffix }}
      LABEL: ${{ matrix.variant.label }}
      CCACHE_DIR: ${{ github.workspace }}/x-wrt/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 3G

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 计算发布标签
      run: |
        if [ "$VARIANT" = "official" ]; then
          echo "RELEASE_TAG=xwrt-r4s-ddr3-official-v${XWRT_TAG}" >> "$GITHUB_ENV"
        else
          echo "RELEASE_TAG=xwrt-r4s-ddr3${SUFFIX}-v${XWRT_TAG}-${DAE_VER#v}" >> "$GITHUB_ENV"
        fi
        echo "变体=$LABEL 标签=$RELEASE_TAG"

    - name: 检查是否已发布
      id: check_release
      run: |
        if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "Release $RELEASE_TAG 已存在，跳过编译"
        fi

    # ============================================================
    # 环境准备：安装依赖 + 清理磁盘空间
    # ============================================================
    - name: 初始化编译环境
      if: steps.check_release.outputs.skip != 'true'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 清理磁盘空间（混合策略）
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/.ghcup /usr/local/share/powershell \
          /usr/local/lib/node_modules /opt/hostedtoolcache

        sudo -E apt-get update
        sudo -E apt-get -y purge \
          dotnet* azure* google* firefox* moby* mysql* \
          firebird* gh* llvm-* postgresql* powershell* openjdk-* \
          mpi-default-dev 2>/dev/null || true
        sudo -E apt-get -y autoremove --purge || true
        sudo -E apt-get clean

        sudo -E apt-get update
        sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk \
          gettext git libncurses5-dev libz-dev patch unzip zlib1g-dev \
          libc6-dev-i386 subversion flex uglifyjs git-core \
          gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo \
          libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf \
          automake libtool autopoint device-tree-compiler \
          python3 python3-pip python3-dev python3-setuptools python3-pyelftools swig \
          clang llvm jq pahole bc libdw-dev gh
        sudo -E apt-get -y autoremove --purge || true
        sudo -E apt-get clean

        echo "=== 磁盘空间 ==="
        df -h .
        echo "================"

    # ============================================================
    # 第一步：下载 immortalwrt 预编译固件（提取 DDR3 兼容的 U-Boot）
    # ============================================================
    - name: 下载 immortalwrt R4S 预编译固件
      if: steps.check_release.outputs.skip != 'true'
      run: |
        mkdir -p immwrt
        cd immwrt

        IMMWRT_BASE="https://downloads.immortalwrt.org"

        if [ "$IMMWRT_TAG" = "snapshot" ]; then
          IMMWRT_URL="$IMMWRT_BASE/snapshots/targets/rockchip/armv8"
        else
          IMMWRT_URL="$IMMWRT_BASE/releases/${IMMWRT_TAG}/targets/rockchip/armv8"
        fi

        echo "从 $IMMWRT_URL 下载..."

        wget -q "$IMMWRT_URL/" -O index.html || {
          echo "无法访问 $IMMWRT_URL/"
          exit 1
        }

        # 查找 R4S squashfs sysupgrade 固件（非 enterprise 版）
        IMG_FILE=$(grep -oP 'immortalwrt-[^"]*friendlyarm_nanopi-r4s-squashfs-sysupgrade\.img\.gz' index.html | head -1)

        if [ -z "$IMG_FILE" ]; then
          echo "未找到 R4S 固件，尝试 enterprise 版..."
          IMG_FILE=$(grep -oP 'immortalwrt-[^"]*friendlyarm_nanopi-r4s-enterprise-squashfs-sysupgrade\.img\.gz' index.html | head -1)
        fi

        if [ -z "$IMG_FILE" ]; then
          echo "未找到 R4S 固件，列出可用文件："
          grep -oP 'immortalwrt-[^"]*\.img\.gz' index.html | head -20
          exit 1
        fi

        echo "下载固件: $IMG_FILE"
        wget -q "$IMMWRT_URL/$IMG_FILE" -O immwrt-r4s.img.gz
        # OpenWrt 的 sysupgrade .img.gz 在 gzip 流后会附加 JSON 元数据，
        # gzip 解压成功但退出码为 2（warning），需要容忍该退出码
        gzip -dc immwrt-r4s.img.gz > immwrt-r4s.img || rc=$?
        if [ "${rc:-0}" -ne 0 ] && [ "${rc:-0}" -ne 2 ]; then
            echo "错误: immwrt-r4s.img.gz 解压失败 (gzip 退出码 ${rc:-0})"
            exit 1
        fi
        rm -f immwrt-r4s.img.gz

        ls -lh immwrt-r4s.img

        # 校验 immortalwrt 引导区布局（pine64-bin: idbloader/uboot.img/trust.bin）
        echo "=== immortalwrt 引导区布局校验 ==="
        dd if=immwrt-r4s.img bs=512 skip=16384 count=1 2>/dev/null | head -c 8 | grep -q 'LOADER  ' || {
          echo "错误: sector 16384 不是 uboot.img（布局可能已变化）"; exit 1; }
        dd if=immwrt-r4s.img bs=512 skip=24576 count=1 2>/dev/null | head -c 4 | grep -q 'BL3X' || {
          echo "错误: sector 24576 不是 trust.bin（布局可能已变化）"; exit 1; }
        echo "布局校验通过"
        echo "================================"

    # ============================================================
    # 第二步：克隆并编译 X-WRT 固件
    # ============================================================
    - name: 克隆 X-WRT 源码
      if: steps.check_release.outputs.skip != 'true'
      run: |
        git clone --depth 1 --branch "$XWRT_TAG" https://github.com/x-wrt/x-wrt.git
        echo "X-WRT 版本: $(cd x-wrt && git log --oneline -1)"

    - name: 更新 feeds
      if: steps.check_release.outputs.skip != 'true'
      run: cd x-wrt && ./scripts/feeds update -a

    - name: 安装 feeds
      if: steps.check_release.outputs.skip != 'true'
      run: cd x-wrt && ./scripts/feeds install -a

    - name: 恢复工具链缓存
      if: steps.check_release.outputs.skip != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          x-wrt/staging_dir/toolchain-*
          x-wrt/staging_dir/host
        key: xwrt-toolchain-v1-${{ env.XWRT_TAG }}-rockchip-armv8
        restore-keys: |
          xwrt-toolchain-v1-

    - name: 恢复 ccache
      if: steps.check_release.outputs.skip != 'true'
      uses: actions/cache/restore@v4
      with:
        path: x-wrt/.ccache
        key: xwrt-ccache-v1-${{ env.XWRT_TAG }}-rockchip-armv8
        restore-keys: |
          xwrt-ccache-v1-

    - name: 添加 dae/daed 软件源
      if: steps.check_release.outputs.skip != 'true' && matrix.variant.id != 'official'
      run: |
        cd x-wrt
        # dae / daed / luci-app-daede 来自 kenzok8 维护源（与 dae 2.x 配套）
        echo 'src-git daede https://github.com/kenzok8/openwrt-daede.git' >> feeds.conf.default
        ./scripts/feeds update daede
        ./scripts/feeds install -a
        ls package/feeds/daede/

    - name: 编译 X-WRT (rockchip-armv8)
      if: steps.check_release.outputs.skip != 'true'
      run: |
        cd x-wrt

        if [ "$VARIANT" != "official" ]; then
          # X-WRT 缺少 USE_LLVM_* 配置项导致 bpf.mk 找不到 clang，
          # 这里直接改用系统 clang/llvm（工作流已安装 clang+llvm）
          sed -i 's|LLVM_PATH:=/invalid|LLVM_PATH:=$(dir $(shell command -v clang))|' include/bpf.mk
          grep -n 'LLVM_PATH:=' include/bpf.mk
          command -v clang && clang --version | head -1
        fi

        cp ../build.sh .
        cp ../upload.sh .

        if [ "$XWRT_TAG" = "master" ]; then
          echo "26.04_b$(date -u '+%Y%m%d%H%M%S')" > release.tag
        else
          echo "$XWRT_TAG" > release.tag
        fi
        echo "版本标签: $(cat release.tag) 变体: $LABEL"

        if [ -f feeds/x/rom/lede/cfg.list ]; then
          echo "=== cfg.list 中的 rockchip 配置 ==="
          grep rockchip feeds/x/rom/lede/cfg.list || echo "未找到 rockchip 配置"
        else
          echo "警告: cfg.list 不存在"
        fi

        if [ -f feeds/x/rom/lede/config.rockchip-armv8 ]; then
          echo "config.rockchip-armv8 存在"
        else
          echo "警告: config.rockchip-armv8 不存在"
        fi

        # 只保留 NanoPi R4S 设备，大幅缩短编译时间和磁盘占用（所有变体）
        sed -i -E 's/^(CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*)=y/# \1 is not set/' feeds/x/rom/lede/config.rockchip-armv8
        echo 'CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s=y' >> feeds/x/rom/lede/config.rockchip-armv8
        grep -q 'CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s=y' feeds/x/rom/lede/config.rockchip-armv8 || {
          echo "错误: R4S 设备配置未生效"; exit 1; }

        if [ "$VARIANT" != "official" ]; then
          # ---- dae / BTF 相关配置 ----
          cat >> feeds/x/rom/lede/config.rockchip-armv8 <<'EOF'
        CONFIG_PACKAGE_luci-app-daede=y
        CONFIG_PACKAGE_luci-app-daede_daed=y
        CONFIG_PACKAGE_daed=y
        CONFIG_PACKAGE_dae=y
        CONFIG_PACKAGE_kmod-sched-core=y
        CONFIG_PACKAGE_kmod-sched-bpf=y
        CONFIG_PACKAGE_kmod-veth=y
        CONFIG_PACKAGE_kmod-xdp-sockets-diag=y
        CONFIG_PACKAGE_kmod-nft-tproxy=y
        CONFIG_PACKAGE_v2ray-geoip=y
        CONFIG_PACKAGE_v2ray-geosite=y
        CONFIG_PACKAGE_ca-bundle=y
        CONFIG_PACKAGE_unzip=y
        CONFIG_PACKAGE_curl=y
        CONFIG_KERNEL_DEBUG_INFO=y
        # CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set
        CONFIG_KERNEL_DEBUG_INFO_BTF=y
        CONFIG_KERNEL_BPF_SYSCALL=y
        CONFIG_KERNEL_BPF_EVENTS=y
        CONFIG_KERNEL_KPROBES=y
        CONFIG_KERNEL_KPROBE_EVENTS=y
        CONFIG_KERNEL_CGROUPS=y
        CONFIG_KERNEL_XDP_SOCKETS=y
        CONFIG_KERNEL_NAMESPACES=y
        CONFIG_KERNEL_NET_NS=y
        CONFIG_KERNEL_CGROUP_BPF=y
        CONFIG_KERNEL_IPV6_MULTIPLE_TABLES=y
        CONFIG_DEVEL=y
        CONFIG_CCACHE=y
        # 关闭内核 BPF 测试套件（BTF 开启后会被 ALL_NONSHARED 自动选中，
        # 但它在 GitHub Actions 的主机 gcc 下无法编译）
        # CONFIG_PACKAGE_kselftests-bpf is not set
        EOF
          # 关闭精简调试信息（BTF 生成要求非 reduced 模式）
          sed -i 's/^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y/# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set/' feeds/x/rom/lede/config.rockchip-armv8
          # 确保 kselftests-bpf 显式不选
          sed -i '/^CONFIG_PACKAGE_kselftests-bpf=/d' feeds/x/rom/lede/config.rockchip-armv8
          echo '# CONFIG_PACKAGE_kselftests-bpf is not set' >> feeds/x/rom/lede/config.rockchip-armv8

          # dae 无 natcap 变体：显式关闭 natcap 全家桶
          if [ "$VARIANT" = "dae-nonatcap" ]; then
            sed -i -E 's/^(CONFIG_PACKAGE_(natcapd|natcapd-client|natcapd-server))=(y|m)/# \1 is not set/' feeds/x/rom/lede/config.rockchip-armv8
            cat >> feeds/x/rom/lede/config.rockchip-armv8 <<'EOF'
        # CONFIG_PACKAGE_luci-app-natcap is not set
        # CONFIG_PACKAGE_kmod-natcap is not set
        EOF
            grep -E '^CONFIG_PACKAGE_natcap|^# CONFIG_PACKAGE_(luci-app-natcap|kmod-natcap)' feeds/x/rom/lede/config.rockchip-armv8 || true
          fi

          # ---- 修复官方 URL 日志页 ACL bug ----
          # cgi-io 执行前会把 /bin/cat（busybox 软链接）解析为 /bin/busybox 再匹配 ACL，
          # 官方只授权了 /bin/cat /tmp/url.log，导致页面报 "Access to command denied by ACL"
          ACL_JSON=feeds/x/luci-app-natflow-users/root/usr/share/rpcd/acl.d/luci-app-natflow-users.json
          if [ -f "$ACL_JSON" ]; then
            grep -q '"/bin/busybox /tmp/url.log"' "$ACL_JSON" || \
              sed -i 's|"/bin/cat /tmp/url.log": \[ "exec" \]|"/bin/cat /tmp/url.log": [ "exec" ],\n\t\t\t\t"/bin/busybox /tmp/url.log": [ "exec" ]|' "$ACL_JSON"
            grep -n 'url.log' "$ACL_JSON"
          else
            echo "警告: 未找到 luci-app-natflow-users ACL 文件"
          fi
          # 页面 JS 还会拿到 stat 解析后的 /bin/busybox 路径并直接执行，
          # busybox 会把日志文件名当作命令名，导致页面空白；这里固定用 /bin/cat
          URLLOG_JS=feeds/x/luci-app-natflow-users/htdocs/luci-static/resources/view/status/urllog.js
          if [ -f "$URLLOG_JS" ]; then
            sed -i 's|var logger = stat\[0\] ? stat\[0\].path : null;|var logger = "/bin/cat";|' "$URLLOG_JS"
            grep -n 'logger' "$URLLOG_JS"
          else
            echo "警告: 未找到 urllog.js"
          fi

          # ---- 直接修改内核 Kconfig 片段，确保 BPF/BTF 真正编进内核 ----
          for KCFG in target/linux/generic/config-6.18 target/linux/rockchip/config-6.18 target/linux/rockchip/armv8/config-6.18; do
            [ -f "$KCFG" ] || continue
            sed -i \
              -e 's/^# CONFIG_BPF_SYSCALL is not set$/CONFIG_BPF_SYSCALL=y/' \
              -e 's/^# CONFIG_BPF_JIT is not set$/CONFIG_BPF_JIT=y/' \
              -e 's/^# CONFIG_BPF_JIT_ALWAYS_ON is not set$/CONFIG_BPF_JIT_ALWAYS_ON=y/' \
              -e 's/^# CONFIG_BPF_STREAM_PARSER is not set$/CONFIG_BPF_STREAM_PARSER=y/' \
              -e 's/^# CONFIG_BPF_EVENTS is not set$/CONFIG_BPF_EVENTS=y/' \
              -e 's/^# CONFIG_CGROUPS is not set$/CONFIG_CGROUPS=y/' \
              -e 's/^# CONFIG_KPROBES is not set$/CONFIG_KPROBES=y/' \
              -e 's/^# CONFIG_KPROBE_EVENTS is not set$/CONFIG_KPROBE_EVENTS=y/' \
              -e 's/^# CONFIG_NAMESPACES is not set$/CONFIG_NAMESPACES=y/' \
              -e 's/^# CONFIG_IPV6_MULTIPLE_TABLES is not set$/CONFIG_IPV6_MULTIPLE_TABLES=y/' \
              -e 's/^# CONFIG_CGROUP_BPF is not set$/CONFIG_CGROUP_BPF=y/' \
              -e 's/^# CONFIG_DEBUG_INFO is not set$/CONFIG_DEBUG_INFO=y/' \
              -e 's/^# CONFIG_DEBUG_INFO_BTF is not set$/CONFIG_DEBUG_INFO_BTF=y/' \
              -e 's/^# CONFIG_NET_INGRESS is not set$/CONFIG_NET_INGRESS=y/' \
              -e 's/^# CONFIG_NET_EGRESS is not set$/CONFIG_NET_EGRESS=y/' \
              -e 's/^# CONFIG_NET_SCH_INGRESS is not set$/CONFIG_NET_SCH_INGRESS=m/' \
              -e 's/^# CONFIG_NET_CLS_BPF is not set$/CONFIG_NET_CLS_BPF=m/' \
              -e 's/^# CONFIG_NET_ACT_BPF is not set$/CONFIG_NET_ACT_BPF=m/' \
              -e 's/^# CONFIG_NET_CLS_ACT is not set$/CONFIG_NET_CLS_ACT=y/' \
              -e 's/^# CONFIG_VETH is not set$/CONFIG_VETH=m/' \
              -e 's/^# CONFIG_XDP_SOCKETS is not set$/CONFIG_XDP_SOCKETS=y/' \
              -e 's/^# CONFIG_XDP_SOCKETS_DIAG is not set$/CONFIG_XDP_SOCKETS_DIAG=m/' \
              "$KCFG"
          done
          # 片段中缺失的关键项也一并追加（重复项由 kconfig 合并，无害）
          cat >> target/linux/generic/config-6.18 <<'EOF'
        CONFIG_BPF_SYSCALL=y
        CONFIG_BPF_JIT=y
        CONFIG_BPF_JIT_ALWAYS_ON=y
        CONFIG_BPF_STREAM_PARSER=y
        CONFIG_BPF_EVENTS=y
        CONFIG_CGROUPS=y
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_NAMESPACES=y
        CONFIG_NET_NS=y
        CONFIG_CGROUP_BPF=y
        CONFIG_IPV6_MULTIPLE_TABLES=y
        CONFIG_DEBUG_INFO=y
        CONFIG_DEBUG_INFO_BTF=y
        CONFIG_NET_INGRESS=y
        CONFIG_NET_EGRESS=y
        CONFIG_NET_SCH_INGRESS=m
        CONFIG_NET_CLS_BPF=m
        CONFIG_NET_ACT_BPF=m
        CONFIG_NET_CLS_ACT=y
        CONFIG_VETH=m
        CONFIG_XDP_SOCKETS=y
        CONFIG_XDP_SOCKETS_DIAG=m
        EOF
          grep -E 'CONFIG_PACKAGE_dae=|CONFIG_KERNEL_DEBUG_INFO_BTF=|CONFIG_KERNEL_BPF_SYSCALL=' feeds/x/rom/lede/config.rockchip-armv8
          grep -E 'CONFIG_(BPF_SYSCALL|BPF_JIT|DEBUG_INFO_BTF|CGROUPS)=' target/linux/generic/config-6.18

          # 只读系统分区 512MB（系统实际占用约 330MB，够用）；
          # 软件分区（overlay）由 X-WRT 首次开机自动创建，下面把默认值改为 1024MB
          sed -i 's/^CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=512/' feeds/x/rom/lede/config.rockchip-armv8
          grep '^CONFIG_TARGET_ROOTFS_PARTSIZE' feeds/x/rom/lede/config.rockchip-armv8
          sed -i 's/overlay_size=\$((1\*512))/overlay_size=\$((1*1024))/' feeds/x/base-config-setting/files/disk_ready.preinit
          grep -qF 'overlay_size=$((1*1024))' feeds/x/base-config-setting/files/disk_ready.preinit || {
            echo "错误: overlay 默认大小修改失败"; exit 1; }

          # ---- 规范化 OpenWrt 配置（消除 out of sync，确保追加项生效）----
          cp feeds/x/rom/lede/config.rockchip-armv8 .config
          make defconfig
          cp .config feeds/x/rom/lede/config.rockchip-armv8
          echo "=== defconfig 后关键项 ==="
          grep -E 'CONFIG_KERNEL_DEBUG_INFO_BTF=|CONFIG_KERNEL_BPF_SYSCALL=|CONFIG_KERNEL_BPF_EVENTS=|CONFIG_KERNEL_CGROUPS=|CONFIG_KERNEL_XDP_SOCKETS=|CONFIG_KERNEL_NAMESPACES=|CONFIG_KERNEL_NET_NS=|CONFIG_KERNEL_DEBUG_INFO_REDUCED' .config || true
          grep -E '^CONFIG_PACKAGE_kselftests-bpf|^CONFIG_PACKAGE_natcap|^# CONFIG_PACKAGE_(luci-app-natcap|kmod-natcap)' .config || true

          # ---- 配置硬校验：任一关键项缺失立即失败，避免发布有问题的固件 ----
          for key in \
              'CONFIG_KERNEL_DEBUG_INFO=y' \
              'CONFIG_KERNEL_DEBUG_INFO_BTF=y' \
              'CONFIG_KERNEL_BPF_SYSCALL=y' \
              'CONFIG_KERNEL_BPF_EVENTS=y' \
              'CONFIG_KERNEL_CGROUPS=y' \
              'CONFIG_KERNEL_XDP_SOCKETS=y' \
              'CONFIG_KERNEL_NAMESPACES=y' \
              'CONFIG_KERNEL_NET_NS=y' \
              'CONFIG_KERNEL_CGROUP_BPF=y' \
              'CONFIG_KERNEL_IPV6_MULTIPLE_TABLES=y' \
              'CONFIG_TARGET_ROOTFS_PARTSIZE=512'; do
            grep -qxF "$key" .config || { echo "错误: defconfig 后缺少 $key"; exit 1; }
          done
          grep -qxF '# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set' .config || { echo "错误: DEBUG_INFO_REDUCED 未关闭"; exit 1; }
          grep -qxF '# CONFIG_PACKAGE_kselftests-bpf is not set' .config || { echo "错误: kselftests-bpf 未显式关闭"; exit 1; }
          if [ "$VARIANT" = "dae-nonatcap" ]; then
            if grep -qE '^CONFIG_PACKAGE_(natcapd|natcapd-client|natcapd-server|luci-app-natcap|kmod-natcap)=y' .config; then
              echo "错误: natcap 未完全关闭"; exit 1
            fi
            echo "natcap 已全部关闭"
          fi
          echo "OpenWrt 配置校验通过"
        else
          echo "=== 官方原版变体：不修改任何配置，保持 X-WRT 官方默认 ==="
          # 仅编译加速选项（不影响固件内容）
          echo 'CONFIG_DEVEL=y' >> feeds/x/rom/lede/config.rockchip-armv8
          echo 'CONFIG_CCACHE=y' >> feeds/x/rom/lede/config.rockchip-armv8
          grep '^CONFIG_TARGET_ROOTFS_PARTSIZE' feeds/x/rom/lede/config.rockchip-armv8
        fi

        echo "=== 编译前磁盘空间 ==="
        df -h .
        echo "======================"

        echo "开始编译 (TARGET=rockchip-armv8, $(nproc) threads)..."
        TARGET=rockchip-armv8 sh build.sh $(nproc)

        echo "=== 编译产物 ==="
        find bin/targets/rockchip/ -name "*.img*" 2>/dev/null | while read f; do
          ls -lh "$f"
        done
        echo "================"

    - name: 验证内核 BTF 与模块配置
      if: steps.check_release.outputs.skip != 'true' && matrix.variant.id != 'official'
      run: |
        cd x-wrt
        echo "=== 内核 .config 关键项 ==="
        KCFG=$(find build_dir -type f -name .config -path '*linux-6.18*' 2>/dev/null | head -1)
        [ -n "$KCFG" ] || { echo "错误: 未找到内核 .config"; exit 1; }
        echo "内核配置: $KCFG"
        grep -E 'CONFIG_(BPF_SYSCALL|BPF_JIT|DEBUG_INFO_BTF|CGROUPS|CGROUP_BPF|VETH|NET_CLS_BPF|NET_ACT_BPF|NET_CLS_ACT|NET_SCH_INGRESS|KPROBES|BPF_EVENTS|NAMESPACES|NET_NS|IPV6_MULTIPLE_TABLES|XDP_SOCKETS|XDP_SOCKETS_DIAG)=' "$KCFG"
        # 任一关键项缺失立即失败
        for key in \
            'CONFIG_BPF_SYSCALL=y' \
            'CONFIG_BPF_JIT=y' \
            'CONFIG_DEBUG_INFO_BTF=y' \
            'CONFIG_CGROUPS=y' \
            'CONFIG_NAMESPACES=y' \
            'CONFIG_NET_NS=y' \
            'CONFIG_CGROUP_BPF=y' \
            'CONFIG_IPV6_MULTIPLE_TABLES=y' \
            'CONFIG_BPF_EVENTS=y' \
            'CONFIG_KPROBES=y' \
            'CONFIG_VETH=m' \
            'CONFIG_NET_CLS_BPF=m' \
            'CONFIG_NET_ACT_BPF=m' \
            'CONFIG_NET_CLS_ACT=y' \
            'CONFIG_NET_SCH_INGRESS=m' \
            'CONFIG_XDP_SOCKETS=y' \
            'CONFIG_XDP_SOCKETS_DIAG=m'; do
          grep -qxF "$key" "$KCFG" || { echo "错误: 内核缺少 $key"; exit 1; }
        done
        echo "内核配置校验通过"

    # ============================================================
    # 第三步：替换 U-Boot 引导区
    # ============================================================
    - name: 替换 U-Boot 引导区
      if: steps.check_release.outputs.skip != 'true'
      run: |
        cd x-wrt
        rm -f ../firmware_paths.txt

        # 查找 X-WRT R4S 固件（squashfs 和 ext4 两种，排除 enterprise 版）
        find_r4s() {
          find bin/targets/rockchip/armv8/ \
            -name "*nanopi-r4s*$1*sysupgrade*.img*" \
            ! -name "*enterprise*" 2>/dev/null | head -1
        }

        SQ_IMG=$(find_r4s squashfs)
        EXT4_IMG=$(find_r4s ext4)

        if [ -z "$SQ_IMG" ] && [ -z "$EXT4_IMG" ]; then
          echo "未找到 R4S 固件文件"
          ls -la bin/targets/rockchip/armv8/ 2>/dev/null || true
          exit 1
        fi

        IMMWRT_IMG="../immwrt/immwrt-r4s.img"

        for IMG in "$SQ_IMG" "$EXT4_IMG"; do
          [ -n "$IMG" ] || continue

          # 如果是 .gz 压缩文件，先解压
          if [[ "$IMG" == *.gz ]]; then
            gzip -dc "$IMG" > "${IMG%.gz}" || rc=$?
            if [ "${rc:-0}" -ne 0 ] && [ "${rc:-0}" -ne 2 ]; then
              echo "错误: X-WRT 固件解压失败 (gzip 退出码 ${rc:-0})"
              exit 1
            fi
            rm -f "$IMG"
            IMG="${IMG%.gz}"
          fi

          OUT_IMG="${IMG%.img}-ddr3.img"
          echo "处理: $IMG -> $OUT_IMG"
          bash ../replace-uboot.sh "$IMG" "$IMMWRT_IMG" "$OUT_IMG"
          echo "$(pwd)/$OUT_IMG" >> ../firmware_paths.txt
        done

        echo "=== 输出固件列表 ==="
        cat ../firmware_paths.txt

    - name: 校验镜像分区表
      if: steps.check_release.outputs.skip != 'true'
      env:
        EXPECT_ROOTFS_SECTORS: ${{ matrix.variant.id == 'official' && 524288 || 1048576 }}
      run: |
        cd x-wrt
        echo "期望 rootfs 分区扇区数: $EXPECT_ROOTFS_SECTORS (官方=256MB / dae=512MB)"
        while IFS= read -r IMG; do
          [ -n "$IMG" ] || continue
          echo "校验: $IMG"
          EXPECT_ROOTFS_SECTORS="$EXPECT_ROOTFS_SECTORS" python3 - "$IMG" <<'PYEOF'
        import os, struct, sys
        img = sys.argv[1]
        with open(img, 'rb') as f:
            mbr = f.read(512)
        assert mbr[510:512] == b'\x55\xaa', 'MBR signature'
        parts = []
        for i in range(4):
            e = mbr[446 + i*16 : 446 + (i+1)*16]
            if e[4] == 0 and e[8:12] == b'\x00'*4:
                continue
            start = struct.unpack_from('<I', e, 8)[0]
            size = struct.unpack_from('<I', e, 12)[0]
            parts.append((start, size))
        print('partitions:', parts)
        assert len(parts) == 2, 'expected 2 partitions, got %d' % len(parts)
        assert parts[0][1] == 131072, 'kernel partition should be 64MiB'
        assert parts[1][1] == int(os.environ['EXPECT_ROOTFS_SECTORS']), 'rootfs partition size mismatch'
        print('OK')
        PYEOF
        done < ../firmware_paths.txt

    - name: 保存工具链缓存
      if: steps.check_release.outputs.skip != 'true' && matrix.variant.id == 'dae'
      uses: actions/cache/save@v4
      with:
        path: |
          x-wrt/staging_dir/toolchain-*
          x-wrt/staging_dir/host
        key: xwrt-toolchain-v1-${{ env.XWRT_TAG }}-rockchip-armv8

    - name: 保存 ccache
      if: steps.check_release.outputs.skip != 'true' && matrix.variant.id == 'dae'
      uses: actions/cache/save@v4
      with:
        path: x-wrt/.ccache
        key: xwrt-ccache-v1-${{ env.XWRT_TAG }}-rockchip-armv8

    # ============================================================
    # 第四步：打包上传
    # ============================================================
    - name: 压缩固件
      if: steps.check_release.outputs.skip != 'true'
      run: |
        OUTPUT_DIR="firmware"
        mkdir -p "$OUTPUT_DIR"

        VERSION_TAG=$(cat x-wrt/release.tag)

        while IFS= read -r IMG_FULL; do
          [ -n "$IMG_FULL" ] || continue
          BASE=$(basename "$IMG_FULL")
          VARIANT_TYPE=$(echo "$BASE" | grep -oE '(squashfs|ext4)' | head -1)
          [ -n "$VARIANT_TYPE" ] || VARIANT_TYPE="img"

          gzip -c "$IMG_FULL" > "$OUTPUT_DIR/xwrt-r4s-ddr3${SUFFIX}-${VARIANT_TYPE}-${VERSION_TAG}.img.gz"
          sha256sum "$IMG_FULL" > "$OUTPUT_DIR/xwrt-r4s-ddr3${SUFFIX}-${VARIANT_TYPE}-${VERSION_TAG}.sha256"
        done < firmware_paths.txt

        {
          echo "X-WRT for NanoPi R4S DDR3 1GB ($LABEL)"
          echo '=================================================='
          echo ''
          echo "Version : $VERSION_TAG"
          echo "U-Boot  : immortalwrt $IMMWRT_TAG (rk3399_ddr_800MHz_v1.30.bin)"
          echo "Built   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ''
          echo 'Includes'
          echo '--------'
          if [ "$VARIANT" = "official" ]; then
            echo '- 完全官方配置（无 dae、官方分区 256MB 系统）'
            echo '- natcap 全家桶（官方默认）'
          else
            echo '- Kernel BTF (CONFIG_DEBUG_INFO_BTF) for dae CO-RE'
            echo '- daed / luci-app-daede (kenzok8 feed)'
            echo '- kmod-sched-core / sched-bpf / veth / xdp-sockets-diag / nft-tproxy'
            echo '- 分区：只读系统 512MB + 软件 overlay 1024MB'
            if [ "$VARIANT" = "dae-nonatcap" ]; then
              echo '- 已移除 natcap（无远程管理/一键VPN/全锥形NAT）'
            else
              echo '- 保留 natcap（官方默认，含远程管理）'
            fi
          fi
          echo ''
          echo 'Files'
          echo '-----'
          echo "- squashfs: xwrt-r4s-ddr3${SUFFIX}-squashfs-${VERSION_TAG}.img.gz"
          echo "- ext4    : xwrt-r4s-ddr3${SUFFIX}-ext4-${VERSION_TAG}.img.gz"
          echo ''
          echo 'Flash'
          echo '-----'
          echo '1. Verify checksum:'
          echo "   sha256sum -c xwrt-r4s-ddr3${SUFFIX}-<variant>-${VERSION_TAG}.sha256"
          echo '2. Write the .img.gz to an SD card (balenaEtcher or dd)'
          echo '3. Boot on NanoPi R4S 1GB (DDR3)'
          echo '4. LuCI: http://192.168.15.1'
        } > "$OUTPUT_DIR/README.txt"

        ls -lh "$OUTPUT_DIR/"

    - name: 上传固件
      if: steps.check_release.outputs.skip != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.variant.id }}-firmware
        path: firmware/
        retention-days: 30

    - name: 发布到 GitHub Release
      if: steps.check_release.outputs.skip != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd firmware
        if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          echo "Release $RELEASE_TAG 已存在，覆盖资产"
        else
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "X-WRT R4S DDR3 1GB Firmware ($LABEL) v$XWRT_TAG" \
            --notes "变体: $LABEL · U-Boot immortalwrt $IMMWRT_TAG" \
            *.img.gz *.sha256 README.txt || true
        fi
        gh release upload "$RELEASE_TAG" *.img.gz *.sha256 README.txt \
          --repo "$GITHUB_REPOSITORY" --clobber
        gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
